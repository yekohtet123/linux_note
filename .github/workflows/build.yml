name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Recreate Android platform and resolve dependencies
        run: |
          rm -rf android .dart_tool build pubspec.lock
          flutter create --platforms=android --org com.example .
          flutter pub get
          flutter pub deps | grep -E 'shared_preferences|plugin_platform_interface' || true
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-notes-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
